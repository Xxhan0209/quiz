  <style>
/* ============================================================
 * 身份图鉴 · 移动优先样式（iOS Safari / Android Chrome / 微信）
 * ============================================================ */
:root{
  --ink:#2D2458;
  --muted:#8880B0;
  --primary:#6B5DB8;
  --accent:#7B68C8;
  --bg:#E8E4F2;
  --line:#DDD8EE;
  --paper:rgba(255,255,255,.9);
  --soft:#F7F4FD;
  --danger:#EF4444;
  --shadow:0 4px 20px rgba(107,93,184,.1);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;
  background:linear-gradient(145deg,#E8E4F2,#EFEAF7 55%,#E4DFEF);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,p{margin-top:0}

/* ---------- 布局壳 ---------- */
.shell{
  width:100%;max-width:680px;margin:auto;
  padding:calc(20px + var(--safe-top)) 16px calc(56px + var(--safe-bottom));
}
.hidden{display:none!important}
.card,.q-header,.q-body,.top-card,.report-section{
  background:var(--paper);box-shadow:var(--shadow);
  border:1px solid rgba(107,93,184,.08);
}
.card{border-radius:24px;padding:24px 22px;margin-bottom:18px}

/* ---------- 通用组件 ---------- */
.icon-box{
  width:72px;height:72px;border-radius:20px;
  background:linear-gradient(135deg,var(--accent),var(--primary));
  display:flex;align-items:center;justify-content:center;
  font-size:34px;margin:14px auto 16px;
  box-shadow:0 8px 28px rgba(107,93,184,.35);
}
.hero-title{font-size:26px;font-weight:900;text-align:center;line-height:1.35;margin-bottom:7px}
.hero-title em{font-style:normal;color:var(--primary)}
.hero-sub{font-size:12px;color:#9180CC;letter-spacing:3px;font-weight:700;text-align:center;margin-bottom:22px}
.lead{font-size:14px;color:#615985;line-height:1.8;text-align:center;margin-bottom:20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px}
.stat{
  background:rgba(255,255,255,.86);border-radius:18px;padding:15px 10px;text-align:center;
  box-shadow:0 2px 14px rgba(107,93,184,.08);color:#756D9E;font-size:12px;
}
.stat b{display:block;font-size:18px;color:var(--primary);margin-bottom:3px}
.info-box{
  background:rgba(255,255,255,.65);border-left:3px solid var(--primary);border-radius:14px;
  padding:13px 16px;color:#5D5682;font-size:13px;line-height:1.7;margin-bottom:18px;
}
.eyebrow{font-size:13px;color:var(--primary);font-weight:800;letter-spacing:.08em;margin-bottom:8px}
.hint{font-size:13px;color:var(--muted);line-height:1.7}
.btn{
  border:none;border-radius:16px;padding:15px 20px;font-weight:800;
  transition:transform .15s,box-shadow .15s,background .15s;
}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.choice:focus-visible,.nav-btn:focus-visible,.answer:focus-visible{
  outline:3px solid rgba(123,104,200,.22);outline-offset:3px;
}
.primary{
  width:100%;background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff;
  box-shadow:0 8px 24px rgba(107,93,184,.35);font-size:17px;letter-spacing:1px;
}
.primary:disabled{opacity:.55;box-shadow:none;cursor:not-allowed}
.ghost{width:100%;background:rgba(255,255,255,.85);border:2px solid var(--line);color:#5A5190}
.intro-actions{display:grid;gap:10px}

/* ---------- 访问门（密码解锁） ---------- */
body.locked{overflow:hidden}
.app-locked{display:none}
.access-gate{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow-y:auto;
  padding:calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
  background:linear-gradient(145deg,#E8E4F2,#EFEAF7);
}
.access-card{
  width:min(460px,100%);margin:auto;background:rgba(255,255,255,.9);
  border-radius:24px;padding:28px 24px;text-align:center;box-shadow:var(--shadow);
}
.lock-mark{font-size:40px;margin-bottom:6px}
.access-card h1{font-size:25px;margin-bottom:8px}
.access-card p{color:var(--muted);font-size:13px;line-height:1.7}
.access-input{
  display:block;width:100%;margin:20px auto 14px;padding:14px;
  border:2px solid var(--line);border-radius:14px;background:#fff;
  text-align:center;font-size:28px;font-weight:800;letter-spacing:12px;
  color:var(--primary);outline:0;
  -webkit-appearance:none;appearance:none;
}
.access-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(123,104,200,.15)}
.access-input:disabled{background:#F3F0FA;color:var(--muted)}
.access-input.shake{animation:shake .3s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}
}
.access-error{min-height:22px;margin:10px 0 0;color:var(--danger);font-size:13px;opacity:0}
.access-error.show{opacity:1}

/* ---------- 偏好选择 ---------- */
.preference h2{font-size:22px;line-height:1.45;margin-bottom:8px}
.choices{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.choice{
  width:100%;border:2px solid #E2DCF5;border-radius:18px;background:rgba(255,255,255,.85);
  padding:16px;text-align:left;display:flex;gap:12px;align-items:flex-start;
  transition:border-color .15s,background .15s,transform .15s;
}
.choice:active{transform:scale(.98)}
.choice.selected{border-color:var(--primary);background:#F4F0FC;box-shadow:0 4px 16px rgba(107,93,184,.14)}
.choice strong{display:block;font-size:15px;margin-bottom:3px}
.choice small{color:var(--muted);font-size:12px;line-height:1.5}
.gender-mark{
  flex:none;width:34px;height:34px;border-radius:50%;
  background:#EFEAF9;color:var(--primary);font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.choice.selected .gender-mark{background:var(--primary);color:#fff}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}

/* ---------- 答题区 ---------- */
.q-header{border-radius:20px;padding:16px 18px;margin-bottom:18px;position:sticky;top:calc(8px + var(--safe-top));z-index:10}
.q-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#8B82B8;margin-bottom:10px}
.q-cat{font-weight:800;color:var(--primary)}
.q-pct{font-weight:800}
.progress-track{height:8px;border-radius:99px;background:#EBE5F8;overflow:hidden}
.progress-bar{display:block;height:100%;width:4%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--primary));transition:width .25s}
.q-body{border-radius:24px;padding:24px 22px}
.q-text{font-size:19px;line-height:1.6;margin:6px 0 18px;min-height:2.6em}
.answer{
  width:100%;border:2px solid #E2DCF5;border-radius:18px;background:rgba(255,255,255,.85);
  padding:15px 16px;text-align:left;font-size:15px;line-height:1.55;
  display:flex;gap:10px;align-items:flex-start;
  transition:border-color .15s,background .15s,transform .15s;
}
.answer:active{transform:scale(.98)}
.answer .opt-mark{
  flex:none;width:26px;height:26px;border-radius:9px;background:#EFEAF9;color:var(--primary);
  font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.answer.selected{border-color:var(--primary);background:#F4F0FC}
.answer.selected .opt-mark{background:var(--primary);color:#fff}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.nav-btn{
  border:2px solid var(--line);background:rgba(255,255,255,.85);color:#5A5190;
  border-radius:14px;padding:11px 18px;font-weight:800;font-size:14px;
}
.nav-btn:disabled{opacity:.45;cursor:not-allowed}
.auto-hint{font-size:12px;color:var(--muted);text-align:center;flex:1}

/* ---------- 结果页 ---------- */
.top-card{border-radius:26px;padding:26px 22px;text-align:center;margin-bottom:18px;position:relative;overflow:hidden}
.top-sub{font-size:12px;letter-spacing:2px;color:#9180CC;font-weight:700;margin-bottom:12px}
.top-icon-emoji{font-size:44px;margin:6px 0 10px}
.match-pct{
  font-size:52px;font-weight:900;line-height:1;
  background:linear-gradient(135deg,var(--accent),var(--primary));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px;
}
.result-name{font-size:32px;font-weight:900;margin:2px 0 6px}
.person-title{font-size:13px;color:var(--muted);margin-bottom:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.tag{
  background:#F1ECFB;color:var(--primary);font-size:12px;font-weight:800;
  border-radius:99px;padding:6px 13px;
}
.dominant-chip{
  display:inline-block;background:linear-gradient(135deg,var(--accent),var(--primary));
  color:#fff;font-size:12px;font-weight:800;border-radius:99px;padding:7px 15px;margin-bottom:16px;
}
.match-reason{background:rgba(255,255,255,.7);border-radius:16px;padding:14px 16px;text-align:left}
.reason-title{font-size:12px;color:var(--primary);font-weight:800;letter-spacing:.08em}
.quote{margin:8px 0 0;font-size:14px;line-height:1.8;color:#514A75}
.report-section{border-radius:24px;padding:22px;margin-bottom:18px}
.section-title{font-size:17px;font-weight:900;margin-bottom:14px}
.bio{font-size:14.5px;line-height:1.9;color:#514A75}
.dimension-grid{display:grid;gap:11px}
.dim-row{display:grid;grid-template-columns:44px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.dim-name{font-weight:800;color:#6B5DB8}
.dim-score{text-align:right;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}
.dim-bar-track{height:9px;border-radius:99px;background:#EBE5F8;overflow:hidden}
.dim-bar{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--primary));transition:width .4s}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.note{
  background:rgba(255,255,255,.72);border-radius:16px;padding:13px 12px;
  font-size:12.5px;line-height:1.75;color:#5D5682;
}
.note b{display:block;color:var(--primary);font-size:12px;margin-bottom:6px}
.line-note{background:rgba(255,255,255,.72);border-radius:16px;padding:13px 12px;font-size:13px;line-height:1.8;color:#514A75}
.share-actions{display:grid;gap:10px;margin-top:4px}
.micro{font-size:11.5px;color:#9A92C2;text-align:center;line-height:1.7;padding:0 12px}

/* ---------- 长按保存弹窗 ---------- */
.save-modal{
  position:fixed;z-index:80;inset:0;display:flex;align-items:flex-start;justify-content:center;
  padding:calc(18px + var(--safe-top)) 18px calc(18px + var(--safe-bottom));
  background:rgba(45,36,88,.52);overflow:auto;
}
.save-panel{
  width:min(680px,100%);margin:auto;background:#fff;border-radius:24px;
  padding:16px;box-shadow:0 24px 70px rgba(45,36,88,.3);
}
.save-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.save-panel-head h2{margin:0;font-size:20px}
.save-close{
  flex:none;width:36px;height:36px;border:none;border-radius:50%;
  background:#F1ECFB;color:var(--primary);font-size:20px;line-height:1;
}
.save-tip{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 12px}
.save-preview{display:block;width:100%;border-radius:14px;border:1px solid var(--line);-webkit-touch-callout:default;touch-callout:default}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(28px + var(--safe-bottom));
  transform:translate(-50%,20px);width:max-content;max-width:min(520px,calc(100% - 32px));
  background:#2D2458;color:#fff;padding:11px 18px;border-radius:18px;
  text-align:center;line-height:1.6;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.25s;z-index:30;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 大屏微调 ---------- */
@media (min-width:700px){
  .hero-title{font-size:30px}
  .q-text{font-size:21px}
}

/* ---------- 减弱动效（无障碍） ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

</script>
  <script>
/* ============================================================
 * 答题网站核心引擎（一般不需要修改；内容配置见 js/data.js）
 * 模块：安全存储 / 访问码解锁+防暴力破解 / 组合题库 / 安全抽题 /
 *       八维计分匹配 / 流程控制 / Canvas 结果长图 / 分享保存降级链
 * ============================================================ */
(() => {
  "use strict";

  const D = window.QUIZ_DATA;
  const $ = s => document.querySelector(s);

  if (!D || !D.dims || !D.archetypes || !D.characters || !D.scenes) {
    document.body.innerHTML = '<p style="padding:40px;text-align:center">数据文件加载失败，请检查 js/data.js</p>';
    return;
  }

  document.title = D.meta.title || document.title;
  const DIMS = D.dims;
  const KEYS = {
    fails: `qz-fails-${D.version}`,
    locks: `qz-locks-${D.version}`,
    lockUntil: `qz-lockuntil-${D.version}`,
    used: `qz-used-${D.version}`,
    result: `qz-result-${D.version}`
  };

  /* ---------- sessionStorage 安全封装（iOS 隐私模式等会抛异常，降级为内存） ---------- */
  const memStore = {};
  const store = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return k in memStore ? memStore[k] : null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { memStore[k] = v; } },
    del(k) { try { sessionStorage.removeItem(k); } catch (e) { delete memStore[k]; } }
  };

  /* ---------- 题库：场景 × 问法视角 组合生成，去重 ---------- */
  function questionTextKey(text) {
    return String(text).normalize("NFKC")
      .replace(/[\s，。！？、；：'’ '“”"（）()【】\[\]-]/g, "")
      .toLowerCase();
  }
  function rotateOptions(options, seed) {
    const shift = seed % options.length;
    return options.slice(shift).concat(options.slice(0, shift));
  }
  function buildBank() {
    const bank = [], seen = new Set();
    const add = q => {
      const key = questionTextKey(q.text);
      if (!seen.has(key)) { seen.add(key); bank.push(q); }
    };
    const buildSide = (scenes, angles, cats) => {
      for (let i = 0; i < scenes.length * angles.length; i++) {
        const si = i % scenes.length, ai = Math.floor(i / scenes.length);
        add({
          cat: cats[(si + ai) % cats.length],
          text: scenes[si].text + "，" + angles[ai],
          options: rotateOptions(scenes[si].options, i)
        });
      }
    };
    buildSide(D.scenes.decision, D.angles.decision, D.categories.decision);
    buildSide(D.scenes.relation, D.angles.relation, D.categories.relation);
    return bank;
  }
  const BANK = buildBank();

  /* ---------- 数据自检（控制台断言，复刻原站做法） ---------- */
  const expectTotal = (D.scenes.decision.length * D.angles.decision.length) + (D.scenes.relation.length * D.angles.relation.length);
  console.assert(BANK.length === expectTotal, `题库应为${expectTotal}题，当前${BANK.length}`);
  console.assert(new Set(BANK.map(q => questionTextKey(q.text))).size === BANK.length, "题干不得重复");
  console.assert(DIMS.every(dim => BANK.some(q => q.options.some(o => o[1] === dim))), "每个维度都必须被题目覆盖");
  console.assert(D.characters.every(c => D.archetypes[c.arch] && D.archetypes[c.arch].vec.length === DIMS.length), "每个角色的原型向量必须有效");

  /* ---------- 安全随机洗牌 ---------- */
  function randomInt(max) {
    if (window.crypto && crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] % max;
    }
    return Math.floor(Math.random() * max);
  }
  function secureShuffle(values) {
    const copy = values.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = randomInt(i + 1);
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  /* ---------- 抽题：决策/人际各半，sessionStorage 记录已用避免重复 ---------- */
  function pickQuestionSet(count) {
    const decDims = new Set(D.decisionDims);
    const decIdx = [], relIdx = [];
    BANK.forEach((q, i) => (q.options.some(o => decDims.has(o[1])) ? decIdx : relIdx).push(i));
    let used = [];
    try { used = JSON.parse(store.get(KEYS.used) || "[]"); } catch (e) { used = []; }
    const usedSet = new Set(used.filter(i => Number.isInteger(i) && i >= 0 && i < BANK.length));
    const take = (pool, amount) => {
      let remaining = pool.filter(i => !usedSet.has(i));
      if (remaining.length < amount) { pool.forEach(i => usedSet.delete(i)); remaining = pool.slice(); }
      const chosen = secureShuffle(remaining).slice(0, amount);
      chosen.forEach(i => usedSet.add(i));
      return chosen;
    };
    const half = Math.floor(count / 2);
    const indexes = secureShuffle(take(decIdx, half).concat(take(relIdx, count - half)));
    store.set(KEYS.used, JSON.stringify([...usedSet]));
    return indexes.map(i => BANK[i]);
  }

  /* ---------- 运行状态 ---------- */
  let Q = [];
  const state = { preference: null, index: 0, answers: [], advanceTimer: null, result: null };

  const introSec = $("#intro"), prefSec = $("#preference"), chromeSec = $("#quizChrome"),
        questionSec = $("#question"), resultSec = $("#result");

  /* ---------- 静态区块构建（内容全部来自 data.js） ---------- */
  function buildIntro() {
    const I = D.intro;
    introSec.innerHTML = `
      <div class="icon-box">${I.icon}</div>
      <h1 class="hero-title">${I.title}</h1>
      <div class="hero-sub">${I.sub}</div>
      <p class="lead">${I.lead}</p>
      <div class="stats">${I.stats.map(s => `<span class="stat"><b>${s[0]}</b>${s[1]}</span>`).join("")}</div>
      <div class="info-box">${I.info}</div>
      <div class="intro-actions">
        <button class="btn primary" id="startBtn">${I.startBtn}</button>
        <button class="btn ghost" id="browseBtn">${I.browseBtn}</button>
      </div>`;
  }
  function buildPreference() {
    const P = D.preference;
    prefSec.innerHTML = `
      <div class="icon-box">${P.icon}</div>
      <div class="hero-sub">${P.sub}</div>
      <h2>${P.title}</h2>
      <p class="hint">${P.hint}</p>
      <div class="choices">
        ${P.options.map(o => `
          <button class="choice gender" data-value="${o.value}">
            <span class="gender-mark">${o.mark}</span>
            <span><strong>${o.title}</strong><small>${o.desc}</small></span>
          </button>`).join("")}
      </div>
      <div class="nav">
        <button class="btn ghost" id="prefBack">${P.backBtn}</button>
        <button class="btn primary" id="prefNext" disabled>${P.nextBtn}</button>
      </div>`;
  }
  function buildChrome() {
    chromeSec.innerHTML = `
      <div class="q-meta">
        <span class="q-cat" id="stageLabel"></span>
        <span class="q-count" id="progressText"></span>
        <span class="q-pct" id="progressPct"></span>
      </div>
      <div class="progress-track"><i class="progress-bar" id="progressBar"></i></div>`;
  }
  function buildQuestionShell() {
    questionSec.innerHTML = `
      <div class="eyebrow" id="chapterName"></div>
      <h2 class="q-text" id="questionText"></h2>
      <div class="choices" id="answerList"></div>
      <div class="q-nav">
        <button class="nav-btn" id="prevBtn">${D.quiz.prevBtn}</button>
        <div class="auto-hint">${D.quiz.autoHint}</div>
        <button class="nav-btn" id="nextBtn" disabled>${D.quiz.nextBtn}</button>
      </div>`;
  }
  function buildResultShell() {
    const R = D.result;
    resultSec.innerHTML = `
      <div class="top-card">
        <div class="top-sub">${R.headSub}</div>
        <div class="top-icon-emoji" id="topIcon"></div>
        <div class="match-pct" id="matchRate"></div>
        <h1 class="result-name" id="resultName"></h1>
        <div class="person-title" id="resultTitle"></div>
        <div class="tags" id="resultTags"></div>
        <div class="dominant-chip" id="dominant"></div>
        <div class="match-reason">
          <span class="reason-title">${R.quoteLabel}</span>
          <p class="quote" id="resultQuote"></p>
        </div>
      </div>
      <section class="report-section">
        <div class="section-title">${R.sections.portrait}</div>
        <div class="bio" id="portrait"></div>
      </section>
      <section class="report-section">
        <div class="section-title">${R.sections.dims}</div>
        <div class="dimension-grid" id="dimensionGrid"></div>
      </section>
      <section class="report-section">
        <div class="section-title">${R.sections.common}</div>
        <div class="three" id="commonGround"></div>
      </section>
      <section class="report-section">
        <div class="section-title">${R.sections.reality}</div>
        <div class="note" style="border-radius:16px"><b>${R.realityLabel}</b><span id="reality"></span></div>
      </section>
      <section class="report-section">
        <div class="section-title">${R.sections.risk}</div>
        <div class="three">
          <div class="note"><b>${R.riskLabels[0]}</b><span id="blindspot"></span></div>
          <div class="note"><b>${R.riskLabels[1]}</b><span id="riskNote"></span></div>
          <div class="note"><b>${R.riskLabels[2]}</b><span id="advice"></span></div>
        </div>
      </section>
      <section class="report-section">
        <div class="section-title">${R.sections.lines}</div>
        <div class="three" id="lines"></div>
      </section>
      <div class="share-actions">
        <button class="btn primary" id="exportBtn"></button>
        <button class="btn ghost" id="restartBtn">${R.restartBtn}</button>
      </div>
      <p class="micro">${R.disclaimer}</p>`;
  }

  buildIntro();
  buildPreference();
  buildChrome();
  buildQuestionShell();
  buildResultShell();
  $("#saveModalTitle").textContent = D.result.saveModal.title;
  $("#saveModalTip").textContent = D.result.saveModal.tip;

  /* ---------- 访问码解锁 + 防暴力破解 ---------- */
  const UNLOCK_LABEL = "立即解锁";
  let countdownTimer = null;

  function lockState() {
    const until = Number(store.get(KEYS.lockUntil) || 0);
    return { active: until > Date.now(), until };
  }
  function stopCountdown() {
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  }
  function refreshLockUI() {
    const input = $("#accessInput"), btn = $("#unlockBtn"), err = $("#accessError");
    const { active, until } = lockState();
    stopCountdown();
    if (active) {
      input.disabled = true; btn.disabled = true;
      const tick = () => {
        const left = Math.max(0, Math.ceil((until - Date.now()) / 1000));
        if (left <= 0) {
          stopCountdown();
          input.disabled = false; btn.disabled = false;
          btn.textContent = UNLOCK_LABEL;
          err.classList.remove("show");
          input.focus();
          return;
        }
        err.textContent = `尝试次数过多，请 ${left} 秒后再试`;
        err.classList.add("show");
        btn.textContent = `已锁定 ${left}s`;
      };
      tick();
      countdownTimer = setInterval(tick, 1000);
    } else {
      input.disabled = false; btn.disabled = false;
      btn.textContent = UNLOCK_LABEL;
    }
  }
  function unlock() {
    if (lockState().active) return;
    const input = $("#accessInput"), err = $("#accessError");
    if (input.value.trim() !== String(D.access.code)) {
      const fails = Number(store.get(KEYS.fails) || 0) + 1;
      store.set(KEYS.fails, String(fails));
      if (fails >= D.access.maxAttempts) {
        const locks = Number(store.get(KEYS.locks) || 0);
        const schedule = D.access.lockoutSchedule;
        const seconds = schedule[Math.min(locks, schedule.length - 1)];
        store.set(KEYS.lockUntil, String(Date.now() + seconds * 1000));
        store.set(KEYS.locks, String(locks + 1));
        store.set(KEYS.fails, "0");
        input.value = "";
        refreshLockUI();
        return;
      }
      err.textContent = `访问码错误，请重新输入（${D.access.maxAttempts - fails} 次机会）`;
      err.classList.add("show");
      input.classList.remove("shake");
      void input.offsetWidth; /* 重置动画 */
      input.classList.add("shake");
      input.value = "";
      input.focus();
      return;
    }
    store.set(KEYS.fails, "0");
    store.set(KEYS.locks, "0");
    store.del(KEYS.lockUntil);
    stopCountdown();
    $("#accessGate").classList.add("hidden");
    $("#appShell").classList.remove("app-locked");
    document.body.classList.remove("locked");
    err.classList.remove("show");
    window.scrollTo(0, 0);
  }
  $("#unlockBtn").onclick = unlock;
  const accessInput = $("#accessInput");
  accessInput.addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
  accessInput.addEventListener("input", () => {
    accessInput.value = accessInput.value.replace(/\D/g, "").slice(0, D.access.length);
    $("#accessError").classList.remove("show");
  });
  /* URL 参数自动解锁：?code=xxxx（同样受锁定限制） */
  const accessParam = new URLSearchParams(location.search).get("code");
  if (accessParam) {
    accessInput.value = String(accessParam).replace(/\D/g, "").slice(0, D.access.length);
    setTimeout(() => { if (!lockState().active) unlock(); }, 150);
  }
  refreshLockUI();

  /* ---------- 流程控制 ---------- */
  const sections = [introSec, prefSec, questionSec, resultSec];
  function show(el) {
    sections.forEach(x => x.classList.add("hidden"));
    el.classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function setChrome(on) { chromeSec.classList.toggle("hidden", !on); }

  function announce(message, duration = 1800) {
    const toast = $("#toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove("show"), duration);
  }

  $("#startBtn").onclick = () => { show(prefSec); setChrome(false); };
  $("#browseBtn").onclick = () => announce(D.intro.browseToast, 6200);
  $("#prefBack").onclick = () => { show(introSec); setChrome(false); };

  document.querySelectorAll(".gender").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".gender").forEach(x => x.classList.remove("selected"));
      btn.classList.add("selected");
      state.preference = btn.dataset.value;
      $("#prefNext").disabled = false;
    };
  });

  $("#prefNext").onclick = () => {
    Q = pickQuestionSet(D.quiz.questionsPerRun);
    state.index = 0;
    state.answers = Array(Q.length).fill(null);
    setChrome(true);
    show(questionSec);
    renderQuestion();
  };

  $("#prevBtn").onclick = () => {
    if (state.index === 0) { show(prefSec); setChrome(false); }
    else { state.index--; renderQuestion(); }
  };
  $("#nextBtn").onclick = advanceQuestion;

  function advanceQuestion() {
    clearTimeout(state.advanceTimer);
    if (state.answers[state.index] === null) return;
    if (state.index < Q.length - 1) {
      state.index++;
      renderQuestion();
      requestAnimationFrame(() => questionSec.scrollIntoView({ behavior: "smooth", block: "start" }));
    } else {
      finish();
    }
  }

  function updateChrome(i) {
    const n = Math.max(1, i + 1), total = Q.length, pct = Math.round(n / total * 100);
    $("#stageLabel").textContent = Q[i].cat;
    $("#progressText").textContent = `${n} / ${total}`;
    $("#progressPct").textContent = `${pct}%`;
    $("#progressBar").style.width = `${pct}%`;
  }

  function renderQuestion() {
    const i = state.index, q = Q[i];
    updateChrome(i);
    $("#chapterName").textContent = q.cat;
    $("#questionText").textContent = q.text;
    const marks = ["A", "B", "C", "D", "E", "F"];
    $("#answerList").innerHTML = q.options.map((opt, k) => {
      const selected = state.answers[i] && state.answers[i][0] === opt[0] ? " selected" : "";
      return `<button class="answer${selected}" data-k="${k}">
        <span class="opt-mark">${marks[k]}</span><span>${opt[0]}</span></button>`;
    }).join("");
    $("#nextBtn").disabled = state.answers[i] === null;
    document.querySelectorAll("#answerList .answer").forEach(btn => {
      btn.onclick = () => {
        state.answers[state.index] = q.options[Number(btn.dataset.k)];
        renderQuestion();
        state.advanceTimer = setTimeout(advanceQuestion, 260);
      };
    });
  }

  /* ---------- 计分与匹配 ---------- */
  function finish() {
    const raw = Object.fromEntries(DIMS.map(d => [d, 12]));
    state.answers.forEach(a => { if (a) raw[a[1]] = (raw[a[1]] || 0) + 1; });
    const values = DIMS.map(d => raw[d]);
    const max = Math.max(...values), min = Math.min(...values);
    const scores = DIMS.map(d => Math.round(38 + (raw[d] - min) / ((max - min) || 1) * 60));

    const pref = state.preference;
    const pool = D.characters.filter(c =>
      (pref === "all" || !pref || c.gender === pref) && D.archetypes[c.arch]);
    const distance = c => {
      const v = D.archetypes[c.arch].vec;
      return Math.sqrt(v.reduce((sum, x, i) => sum + (x - scores[i]) ** 2, 0));
    };
    const ranked = pool.map(c => ({ c, d: distance(c) })).sort((a, b) => a.d - b.d);
    const character = ranked[0].c, arch = D.archetypes[character.arch];
    const similarity = Math.max(76, Math.min(97, Math.round(100 - ranked[0].d / 4.8)));

    state.result = { character, arch, scores, similarity };
    store.set(KEYS.result, JSON.stringify({
      name: character.name, similarity, preference: pref, scores
    }));
    renderResult();
    setChrome(false);
    show(resultSec);
  }

  function renderResult() {
    const { character, arch, scores, similarity } = state.result;
    const R = D.result;
    const top = DIMS.map((d, i) => [d, scores[i]]).sort((x, y) => y[1] - x[1]).slice(0, 3);

    $("#topIcon").textContent = D.intro.icon;
    $("#matchRate").textContent = `${similarity}%`;
    $("#resultName").textContent = character.name;
    $("#resultTitle").textContent = `${character.era} · ${character.role}`;
    $("#resultTags").innerHTML = arch.tags.map(t => `<span class="tag">${t}</span>`).join("");
    $("#dominant").textContent = `${R.dominantLabel} · ${top.map(t => t[0]).join(" / ")}`;
    $("#resultQuote").textContent = character.quote;
    $("#portrait").textContent = arch.portrait;
    $("#dimensionGrid").innerHTML = DIMS.map((d, i) => `
      <div class="dim-row">
        <span class="dim-name">${d}</span>
        <span class="dim-bar-track"><i class="dim-bar" style="width:${scores[i]}%"></i></span>
        <span class="dim-score">${scores[i]}</span>
      </div>`).join("");
    $("#commonGround").innerHTML = top.map(t =>
      `<div class="note"><b>${t[0]}</b><span>${R.commonMap[t[0]] || ""}</span></div>`).join("");
    $("#reality").textContent = arch.reality;
    $("#blindspot").textContent = arch.blind;
    $("#riskNote").textContent = arch.risk;
    $("#advice").textContent = arch.advice;
    $("#lines").innerHTML = arch.lines.map(l => `<div class="line-note">${l}</div>`).join("");
    refreshExportLabel();
  }

  /* ---------- Canvas 结果长图（纯 2D 手绘，无第三方库） ---------- */
  function roundedRectPath(c, x, y, w, h, r) {
    const radius = Math.max(0, Math.min(Number(r) || 0, Math.abs(w) / 2, Math.abs(h) / 2));
    c.beginPath();
    c.moveTo(x + radius, y);
    c.arcTo(x + w, y, x + w, y + h, radius);
    c.arcTo(x + w, y + h, x, y + h, radius);
    c.arcTo(x, y + h, x, y, radius);
    c.arcTo(x, y, x + w, y, radius);
    c.closePath();
  }

  function captureWholeResult() {
    const { character, arch, scores, similarity } = state.result;
    const R = D.result;
    const top = DIMS.map((d, i) => [d, scores[i]]).sort((x, y) => y[1] - x[1]).slice(0, 3);

    const canvas = document.createElement("canvas");
    const c = canvas.getContext("2d");
    const W = 1200, margin = 56, cardW = W - margin * 2, gap = 26, pad = 36;
    const font = (size, weight) => `${weight || 400} ${size}px "PingFang SC","Microsoft YaHei",sans-serif`;

    const split = (value, maxWidth, size, weight) => {
      c.font = font(size, weight);
      const rows = [];
      String(value || "").split("\n").forEach(part => {
        let line = "";
        for (const ch of part) {
          if (c.measureText(line + ch).width > maxWidth && line) { rows.push(line); line = ch; }
          else { line += ch; }
        }
        rows.push(line);
      });
      return rows;
    };
    const blockHeight = (value, maxWidth, size, lineHeight, weight) =>
      split(value, maxWidth, size, weight).length * lineHeight;

    const innerW = cardW - pad * 2, colGap = 20, colW = (innerW - colGap * 2) / 3;

    /* 先测量各分区高度 */
    const quoteLines = split(character.quote, innerW - 32, 24, 400);
    const quoteH = 26 + quoteLines.length * 40 + 30;
    const topH = 66 + 26 + 62 + 84 + 66 + 32 + 48 + 46 + quoteH + 34;

    const portraitH = 96 + blockHeight(arch.portrait, innerW, 25, 42, 400) + 26;
    const dimensionsH = 96 + DIMS.length * 52 + 16;
    const common = top.map(t => ({ title: t[0], body: R.commonMap[t[0]] || "" }));
    const commonInnerH = Math.max(...common.map(it => 88 + blockHeight(it.body, colW - 36, 21, 36, 400)), 200);
    const commonH = 96 + commonInnerH + 22;
    const realityH = 96 + blockHeight(arch.reality, innerW - 36, 23, 39, 400) + 58;
    const risks = [
      { title: R.riskLabels[0], body: arch.blind },
      { title: R.riskLabels[1], body: arch.risk },
      { title: R.riskLabels[2], body: arch.advice }
    ];
    const riskInnerH = Math.max(...risks.map(it => 88 + blockHeight(it.body, colW - 36, 21, 36, 400)), 210);
    const riskH = 96 + riskInnerH + 22;
    const lines = arch.lines;
    const linesInnerH = Math.max(...lines.map(v => 56 + blockHeight(v, colW - 36, 22, 38, 600)), 140);
    const linesH = 96 + linesInnerH + 22;

    const totalH = margin + topH + gap + portraitH + gap + dimensionsH + gap + commonH + gap +
      realityH + gap + riskH + gap + linesH + 118;

    canvas.width = W;
    canvas.height = totalH;

    const round = (x, y, w, h, r, fill, stroke) => {
      roundedRectPath(c, x, y, w, h, r);
      if (fill) { c.fillStyle = fill; c.fill(); }
      if (stroke) { c.strokeStyle = stroke; c.lineWidth = 2; c.stroke(); }
    };
    const text = (value, x, y, size, color, weight, align) => {
      c.font = font(size, weight);
      c.fillStyle = color || "#2D2458";
      c.textAlign = align || "left";
      c.textBaseline = "top";
      c.fillText(value, x, y);
    };
    const paragraph = (value, x, y, maxWidth, size, lineHeight, color, weight, align) => {
      split(value, maxWidth, size, weight).forEach((row, i) =>
        text(row, x, y + i * lineHeight, size, color, weight, align));
    };
    const section = (title, y, h) => {
      round(margin, y, cardW, h, 28, "#FFFFFF", "#E2DCF5");
      text(title, margin + pad, y + 34, 29, "#2D2458", 900);
      return y + 96;
    };

    /* 背景 */
    const bg = c.createLinearGradient(0, 0, W, totalH);
    bg.addColorStop(0, "#F7F4FD");
    bg.addColorStop(.55, "#EFEAF7");
    bg.addColorStop(1, "#E8E4F2");
    c.fillStyle = bg;
    c.fillRect(0, 0, W, totalH);

    /* 顶部结果卡 */
    let y = margin;
    round(margin, y, cardW, topH, 34, "#FFFFFF", "#E2DCF5");
    text(R.headSub, W / 2, y + 40, 22, "#9180CC", 700, "center");
    text(String(D.intro.icon), W / 2, y + 76, 56, "#2D2458", 400, "center");
    const pctGradient = c.createLinearGradient(W / 2 - 140, 0, W / 2 + 140, 0);
    pctGradient.addColorStop(0, "#7B68C8");
    pctGradient.addColorStop(1, "#6B5DB8");
    c.font = font(74, 900);
    c.fillStyle = pctGradient;
    c.textAlign = "center";
    c.textBaseline = "top";
    c.fillText(`${similarity}%`, W / 2, y + 148);
    text(character.name, W / 2, y + 238, 58, "#2D2458", 900, "center");
    text(`${character.era} · ${character.role}`, W / 2, y + 308, 23, "#8880B0", 400, "center");
    /* 标签 */
    c.font = font(21, 700);
    const tagGap = 12;
    const tagW = arch.tags.map(t => c.measureText(t).width + 40);
    const tagsTotal = tagW.reduce((s, w) => s + w, 0) + tagGap * (tagW.length - 1);
    let tx = (W - tagsTotal) / 2;
    arch.tags.forEach((t, i) => {
      round(tx, y + 352, tagW[i], 42, 21, "#F1ECFB", null);
      text(t, tx + tagW[i] / 2, y + 362, 21, "#6B5DB8", 700, "center");
      tx += tagW[i] + tagGap;
    });
    /* 主导维度 */
    const dominant = `${R.dominantLabel} · ${top.map(t => t[0]).join(" / ")}`;
    c.font = font(21, 700);
    const domW = c.measureText(dominant).width + 44;
    const domGrad = c.createLinearGradient((W - domW) / 2, 0, (W + domW) / 2, 0);
    domGrad.addColorStop(0, "#7B68C8");
    domGrad.addColorStop(1, "#6B5DB8");
    roundedRectPath(c, (W - domW) / 2, y + 412, domW, 44, 22);
    c.fillStyle = domGrad;
    c.fill();
    text(dominant, W / 2, y + 422, 21, "#FFFFFF", 700, "center");
    /* 心声 */
    const quoteY = y + 478;
    round(margin + pad, quoteY, innerW, quoteH, 18, "rgba(241,236,251,.7)", null);
    text(R.quoteLabel, margin + pad + 18, quoteY + 16, 19, "#6B5DB8", 800);
    quoteLines.forEach((row, i) =>
      text(row, W / 2, quoteY + 50 + i * 40, 24, "#514A75", 400, "center"));
    y += topH + gap;

    /* 01 自画像 */
    let bodyY = section(R.sections.portrait, y, portraitH);
    paragraph(arch.portrait, margin + pad, bodyY, innerW, 25, 42, "#514A75", 400);
    y += portraitH + gap;

    /* 02 八维 */
    bodyY = section(R.sections.dims, y, dimensionsH);
    DIMS.forEach((d, i) => {
      const ry = bodyY + i * 52;
      text(d, margin + pad, ry + 4, 23, "#6B5DB8", 800);
      const trackX = margin + pad + 96, trackW = innerW - 96 - 76;
      roundedRectPath(c, trackX, ry + 10, trackW, 16, 8);
      c.fillStyle = "#EBE5F8";
      c.fill();
      const barGrad = c.createLinearGradient(trackX, 0, trackX + trackW, 0);
      barGrad.addColorStop(0, "#7B68C8");
      barGrad.addColorStop(1, "#6B5DB8");
      roundedRectPath(c, trackX, ry + 10, Math.max(16, trackW * scores[i] / 100), 16, 8);
      c.fillStyle = barGrad;
      c.fill();
      text(String(scores[i]), margin + pad + innerW, ry + 2, 24, "#6B5DB8", 800, "right");
    });
    y += dimensionsH + gap;

    /* 03 共同底色（三列） */
    bodyY = section(R.sections.common, y, commonH);
    common.forEach((it, i) => {
      const cx = margin + pad + i * (colW + colGap);
      round(cx, bodyY, colW, commonInnerH, 18, "rgba(247,244,253,.9)", null);
      text(it.title, cx + 18, bodyY + 18, 21, "#6B5DB8", 800);
      paragraph(it.body, cx + 18, bodyY + 56, colW - 36, 21, 36, "#5D5682", 400);
    });
    y += commonH + gap;

    /* 04 现实中的你 */
    bodyY = section(R.sections.reality, y, realityH);
    paragraph(arch.reality, margin + pad + 4, bodyY + 8, innerW - 36, 23, 39, "#5D5682", 400);
    y += realityH + gap;

    /* 05 盲点与风险（三列） */
    bodyY = section(R.sections.risk, y, riskH);
    risks.forEach((it, i) => {
      const cx = margin + pad + i * (colW + colGap);
      round(cx, bodyY, colW, riskInnerH, 18, "rgba(247,244,253,.9)", null);
      text(it.title, cx + 18, bodyY + 18, 21, "#6B5DB8", 800);
      paragraph(it.body, cx + 18, bodyY + 56, colW - 36, 21, 36, "#5D5682", 400);
    });
    y += riskH + gap;

    /* 06 台词（三列） */
    bodyY = section(R.sections.lines, y, linesH);
    lines.forEach((l, i) => {
      const cx = margin + pad + i * (colW + colGap);
      round(cx, bodyY, colW, linesInnerH, 18, "rgba(247,244,253,.9)", null);
      paragraph(`“${l}”`, cx + 18, bodyY + 22, colW - 36, 22, 38, "#514A75", 600);
    });

    /* 页脚 */
    text(R.disclaimer, W / 2, totalH - 74, 19, "#9A92C2", 400, "center");
    text(R.footer, W / 2, totalH - 46, 18, "#B4ABDD", 700, "center");

    return canvas;
  }

  /* ---------- 导出与保存（三级降级：系统分享 → 长按保存 → 桌面下载） ---------- */
  const phoneSaveMode = () =>
    matchMedia("(max-width:900px)").matches ||
    /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
  const canShareFile = file => {
    try {
      return typeof navigator.share === "function" &&
        typeof navigator.canShare === "function" &&
        navigator.canShare({ files: [file] });
    } catch (e) { return false; }
  };
  function canvasToBlob(canvas) {
    return new Promise(resolve => {
      if (canvas.toBlob) {
        canvas.toBlob(b => resolve(b), "image/png");
      } else {
        const dataURL = canvas.toDataURL("image/png");
        const parts = dataURL.split(",");
        const bin = atob(parts[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type: "image/png" }));
      }
    });
  }
  function downloadOnComputer(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  let savePreviewUrl = "";
  function closeSaveModal() {
    $("#saveModal").classList.add("hidden");
    $("#savePreview").removeAttribute("src");
    if (savePreviewUrl) { URL.revokeObjectURL(savePreviewUrl); savePreviewUrl = ""; }
  }
  function showSaveModal(blob) {
    closeSaveModal();
    savePreviewUrl = URL.createObjectURL(blob);
    $("#savePreview").src = savePreviewUrl;
    $("#saveModal").classList.remove("hidden");
  }
  $("#saveModalClose").onclick = closeSaveModal;
  $("#saveModal").onclick = event => { if (event.target === $("#saveModal")) closeSaveModal(); };

  function refreshExportLabel() {
    const button = $("#exportBtn");
    if (button && !button.disabled) {
      button.textContent = phoneSaveMode() ? D.result.exportBtnMobile : D.result.exportBtnDesktop;
    }
  }
  window.addEventListener("resize", refreshExportLabel);

  $("#exportBtn").onclick = async () => {
    if (!state.result) { announce("请先完成测试"); return; }
    const button = $("#exportBtn");
    const mobile = phoneSaveMode();
    button.disabled = true;
    button.textContent = D.result.exportBusy;
    try {
      const canvas = captureWholeResult();
      const blob = await canvasToBlob(canvas);
      if (!blob) throw new Error("empty image");
      const fileName = `${D.result.fileNamePrefix}-${state.result.character.name}-完整结果.png`;
      const file = new File([blob], fileName, { type: "image/png" });
      if (mobile) {
        if (canShareFile(file)) {
          try {
            await navigator.share({ files: [file], title: document.title });
            announce("已交给系统保存");
            return;
          } catch (error) {
            if (error && error.name === "AbortError") return; /* 用户取消 */
          }
        }
        showSaveModal(blob); /* 微信等不支持系统分享的浏览器 */
        return;
      }
      downloadOnComputer(blob, fileName);
      announce("完整结果图已下载");
    } catch (error) {
      console.error(error);
      announce("图片生成失败，请刷新后重试");
    } finally {
      button.disabled = false;
      refreshExportLabel();
    }
  };

  /* ---------- 重新测试（保留已抽题记录，重测不重复） ---------- */
  $("#restartBtn").onclick = () => {
    state.preference = null;
    state.index = 0;
    state.answers = [];
    state.result = null;
    Q = [];
    clearTimeout(state.advanceTimer);
    document.querySelectorAll(".gender").forEach(x => x.classList.remove("selected"));
    $("#prefNext").disabled = true;
    show(introSec);
    window.scrollTo(0, 0);
  };
})();

</script>
